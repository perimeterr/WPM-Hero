{% extends 'base.html' %}
{% load static %}

{% block title %}WPM Hero{% endblock %}

{% block content %}
    <main>
        <div class="top-panel">
            
            <div class="panel-wpm">
                <p><span id="wpm">0</span> <br/>wpm</p>
            </div>
            
            <div class="timer"><span id="time">0s</span></div>
            <div class="panel-accuracy">
                <span id="accuracy">0%</span>
            </div>
            
            
        </div>
        <div class="settings-panel">
            <form method="GET">
                <label>Difficulty:</label>
                <select id="difficulty" name="difficulty" onchange="this.form.submit()">
                    <option value="easy" {% if test_text.difficulty == "easy" %}selected{% endif %}>Easy</option>
                    <option value="medium" {% if test_text.difficulty == "medium" %}selected{% endif %}>Medium</option>
                    <option value="hard" {% if test_text.difficulty == "hard" %}selected{% endif %}>Hard</option>
                </select>
                <label>Timer:</label>
                <select id="timer" name="timer" onchange="this.form.submit()">
                    <option value="60" {% if test_timer.selected_timer == "60" %}selected{% endif %}>60</option>
                    <option value="30" {% if test_timer.selected_timer == "30" %}selected{% endif %}>30</option>
                    <option value="15" {% if test_timer.selected_timer == "15" %}selected{% endif %}>15</option>
                </select>
            </form>
        </div>
        
    </main>
    

    <div id="text-content" class="text-display">
        {% for char in test_text.display_text %}
            <span class="char">{% if char == " " %}&nbsp;{% else %}{{ char }}{% endif %}</span>
        {% endfor %}
    </div>

    <hr>
    
    <div class="typing-area">
        <h3>Start Typing Below:</h3>
        <textarea id="typing-input" placeholder="Start typing here..."></textarea>
    </div>
    
{% endblock %}

{% block extra_js %}
    <script type="module" src="{% static 'script.js' %}"></script>
{% endblock %}
