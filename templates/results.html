{% extends 'base.html' %}
{% load static %}

{% block title %}Results{% endblock %}

{% block content %}
    <div class="results-page">
        <div class="results-actions">
            <button id="replay-btn" class="results-button results-button--primary" onclick="window.location.href='{% url 'home:home' %}?difficulty={{ difficulty }}&replay=true'">Replay</button>
            <button id="new-test-btn" class="results-button results-button--secondary" onclick="window.location.href='{% url 'home:home' %}'">New Test</button>
        </div>

        <div class="results-top-half">
            <div class="results-card results-card--mistakes">
                <ul id="mistake-list" class="mistake-list"></ul>
            </div>

            <div class="results-card results-card--metrics">
                <div class="results-metric-stack">
                    <div class="results-metric">
                        <span id="wpm" class="results-metric-value">0.00</span>
                        <span class="results-metric-suffix">wpm</span>
                    </div>
                    <div class="results-metric">
                        <span id="accuracy" class="results-metric-value">0.00</span>
                        <span class="results-metric-suffix">%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block extra_js %}
    <script type="module" src="{% static 'results.js' %}"></script>
    <script>
        const isLoggedIn = {% if user.is_authenticated %}true{% else %}false{% endif %};
        const testDifficulty = "{{ difficulty }}";
        const testTimer = "{{ timer }}";
    </script>
{% endblock %}
